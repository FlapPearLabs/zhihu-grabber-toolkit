name: Expand external audit snapshot

on:
  push:
    branches:
      - audit/claude-external-review-2026-08-27
    paths:
      - external-audit-bootstrap/TRIGGER

permissions:
  contents: write

jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/claude-external-review-2026-08-27
          fetch-depth: 0

      - name: Reconstruct source archives
        shell: bash
        run: |
          set -euo pipefail
          cat external-audit-bootstrap/context/part-*.b64 | base64 --decode > /tmp/context.zip
          cat external-audit-bootstrap/workbuddy/part-*.b64 | base64 --decode > /tmp/workbuddy.zip
          sha256sum /tmp/context.zip /tmp/workbuddy.zip

      - name: Expand audit materials
        shell: bash
        run: |
          set -euo pipefail
          rm -rf external-audit/2026-08-27
          mkdir -p external-audit/2026-08-27/chatgpt-context external-audit/2026-08-27/workbuddy-evidence external-audit/2026-08-27/review
          python - <<'PY'
          import zipfile, os, shutil

          def extract_normalized(zp, dest, strip_prefix=None):
              with zipfile.ZipFile(zp) as z:
                  for info in z.infolist():
                      name = info.filename.replace('\\\\', '/').replace('\\', '/')
                      if strip_prefix and name.startswith(strip_prefix):
                          name = name[len(strip_prefix):]
                      parts = [p for p in name.split('/') if p and p not in ('.', '..')]
                      if not parts or name.endswith('/'):
                          continue
                      out = os.path.join(dest, *parts)
                      os.makedirs(os.path.dirname(out), exist_ok=True)
                      with z.open(info) as src, open(out, 'wb') as dst:
                          shutil.copyfileobj(src, dst)

          extract_normalized('/tmp/context.zip', 'external-audit/2026-08-27/chatgpt-context', 'ZHCLIPRO_CHATGPT_CONTEXT_AUDIT_PACK_V2/')
          extract_normalized('/tmp/workbuddy.zip', 'external-audit/2026-08-27/workbuddy-evidence')
          PY
          cp external-audit-bootstrap/CLAUDE_AUDITOR_PROMPT_V2.md external-audit/2026-08-27/review/CLAUDE_AUDITOR_PROMPT_V2.md
          cp external-audit-bootstrap/README.md external-audit/2026-08-27/README.md

      - name: Generate file integrity manifest
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib
          root = Path('external-audit/2026-08-27')
          rows = []
          for p in sorted(root.rglob('*')):
              if p.is_file() and p.name != 'FILES_SHA256.txt':
                  rows.append(f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.relative_to(root).as_posix()}")
          out = root / 'review' / 'FILES_SHA256.txt'
          out.write_text('\n'.join(rows) + '\n', encoding='utf-8')
          print('expanded files:', sum(1 for p in root.rglob('*') if p.is_file()))
          PY

      - name: Commit expanded audit snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- external-audit/2026-08-27
          git diff --cached --check
          git commit -m 'audit: expand complete Claude review snapshot'
          git push origin HEAD:audit/claude-external-review-2026-08-27

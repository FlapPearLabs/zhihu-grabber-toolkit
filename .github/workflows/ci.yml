name: CI

on:
  push:
    branches: [master, fix/skill-engineering-repair]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [22]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          # 未启用 npm cache（setup-node 默认不缓存；lockfile 位于 zhihu-answer-grabber/ 子目录）

      # parse5 是 zhihu-answer-grabber 的运行时依赖（src/asset-extractor.js）：缺失时测试套件
      # 在 import 阶段即 ERR_MODULE_NOT_FOUND；根级集成测试 spawn 的同一 CLI 也需要它。
      # corpus-anthology 无任何依赖（亦无 lockfile），无需安装步骤。
      - name: Install zhihu-answer-grabber dependencies
        working-directory: zhihu-answer-grabber
        run: npm ci --registry=https://registry.npmjs.org

      - name: zhihu-answer-grabber tests
        working-directory: zhihu-answer-grabber
        run: node --test

      - name: corpus-anthology tests
        working-directory: corpus-anthology
        run: node --test

      # 根级 CLI × Skill 契约 / pipeline 集成测试（P1-TEST-NEW-3）。
      # 显式文件路径：避免 `node --test test/` 在 Windows 上把目录当模块解析。
      - name: repository integration tests
        run: node --test test/agent-pipeline.test.mjs

      # research-orchestration planner（P1-T18 / Issue #50 D4）。
      # 该子系统此前完全未纳入 CI，导致 PR #84 的语法错误（同一函数作用域内重复
      # `const` 声明 + 在 validatePlanJson 之前引用 v.plan）未被拦截即合入 master。
      # 最小防护范围：语法门 + focused planner 测试（research-orchestration 其余
      # 套件存在既存失败，不纳入本最小修复）。
      # 显式文件路径：避免 `node --test <dir>` 在 Windows 上把目录当模块解析。
      - name: research-orchestration planner syntax gate
        run: node --check research-orchestration/lib/planner.mjs

      - name: research-orchestration planner tests
        run: node --test research-orchestration/test/planner.test.mjs

      - name: research-orchestration preflight entrypoint tests
        run: node --test research-orchestration/test/integration-preflight.test.mjs

      # D6 SCOPED REPAIR — T14 async runtime contract mismatch (CI ESCAPE GUARD).
      # 背景：T14 消费方曾把 Promise-returning 的 runtime.synthesize() 当同步对象
      # 校验，确定性产出 T14_RUNTIME_OUTPUT_INVALID（cfi_synthesis_failed @ T16）。
      # 根因是测试替身全部使用 SYNC synthesize()，CI 因此从未覆盖真实异步 seam。
      # 该测试套件强制包含一个真实 async synthesize + 生产形态 DeepSeek adapter
      # （注入 fake fetch，无网络）的兼容性用例；只含同步 mock 的套件不足以防回归。
      - name: T14 async seam syntax gates
        run: |
          node --check research-orchestration/lib/cross-source-synthesis.mjs
          node --check research-orchestration/lib/coverage-final-integration.mjs
          node --check research-orchestration/lib/p1-runtime-composer.mjs

      - name: T14 async runtime seam tests (async synthesize escape guard)
        run: node --test research-orchestration/test/p1-t14-async-runtime-seam.test.mjs

      - name: T14/T15 focused contract tests
        run: |
          node --test research-orchestration/test/p1-t14-cross-group-synthesis.test.mjs
          node --test research-orchestration/test/p1-t15-coverage-final-integration.test.mjs
          node --test research-orchestration/test/p1-t15-runtime-composition-wiring.test.mjs

name: CI

on:
  push:
    branches: [master, fix/skill-engineering-repair]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [22]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          # 项目无 package-lock.json 且两个模块均无 dependencies，按 setup-node 文档要求关闭 npm cache

      - name: zhihu-answer-grabber tests
        working-directory: zhihu-answer-grabber
        run: node --test

      - name: corpus-anthology tests
        working-directory: corpus-anthology
        run: node --test

      # 根级 CLI × Skill 契约 / pipeline 集成测试（P1-TEST-NEW-3）。
      # 显式文件路径：避免 `node --test test/` 在 Windows 上把目录当模块解析。
      - name: repository integration tests
        run: node --test test/agent-pipeline.test.mjs

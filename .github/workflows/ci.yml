name: CI

on:
  push:
    branches: [master, fix/skill-engineering-repair]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [22]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          # 未启用 npm cache（setup-node 默认不缓存；lockfile 位于 zhihu-answer-grabber/ 子目录）

      # parse5 是 zhihu-answer-grabber 的运行时依赖（src/asset-extractor.js）：缺失时测试套件
      # 在 import 阶段即 ERR_MODULE_NOT_FOUND；根级集成测试 spawn 的同一 CLI 也需要它。
      # corpus-anthology 无任何依赖（亦无 lockfile），无需安装步骤。
      - name: Install zhihu-answer-grabber dependencies
        working-directory: zhihu-answer-grabber
        run: npm ci --registry=https://registry.npmjs.org

      - name: zhihu-answer-grabber tests
        working-directory: zhihu-answer-grabber
        run: node --test

      - name: corpus-anthology tests
        working-directory: corpus-anthology
        run: node --test

      # 根级 CLI × Skill 契约 / pipeline 集成测试（P1-TEST-NEW-3）。
      # 显式文件路径：避免 `node --test test/` 在 Windows 上把目录当模块解析。
      - name: repository integration tests
        run: node --test test/agent-pipeline.test.mjs

      # research-orchestration planner（P1-T18 / Issue #50 D4）。
      # 该子系统此前完全未纳入 CI，导致 PR #84 的语法错误（同一函数作用域内重复
      # `const` 声明 + 在 validatePlanJson 之前引用 v.plan）未被拦截即合入 master。
      # 最小防护范围：语法门 + focused planner 测试（research-orchestration 其余
      # 套件存在既存失败，不纳入本最小修复）。
      # 显式文件路径：避免 `node --test <dir>` 在 Windows 上把目录当模块解析。
      - name: research-orchestration planner syntax gate
        run: node --check research-orchestration/lib/planner.mjs

      - name: research-orchestration planner tests
        run: node --test research-orchestration/test/planner.test.mjs

      - name: research-orchestration preflight entrypoint tests
        run: node --test research-orchestration/test/integration-preflight.test.mjs

      # D6 SCOPED REPAIR — T14 async runtime contract mismatch (CI ESCAPE GUARD).
      # 背景：T14 消费方曾把 Promise-returning 的 runtime.synthesize() 当同步对象
      # 校验，确定性产出 T14_RUNTIME_OUTPUT_INVALID（cfi_synthesis_failed @ T16）。
      # 根因是测试替身全部使用 SYNC synthesize()，CI 因此从未覆盖真实异步 seam。
      # 该测试套件强制包含一个真实 async synthesize + 生产形态 DeepSeek adapter
      # （注入 fake fetch，无网络）的兼容性用例；只含同步 mock 的套件不足以防回归。
      - name: T14 async seam syntax gates
        run: |
          node --check research-orchestration/lib/cross-source-synthesis.mjs
          node --check research-orchestration/lib/cross-group-aggregation.mjs
          node --check research-orchestration/lib/coverage-final-integration.mjs
          node --check research-orchestration/lib/p1-runtime-composer.mjs

      - name: T14 async runtime seam tests (async synthesize escape guard)
        run: node --test research-orchestration/test/p1-t14-async-runtime-seam.test.mjs

      - name: T14/T15 focused contract tests
        run: |
          node --test research-orchestration/test/p1-t14-cross-group-synthesis.test.mjs
          node --test research-orchestration/test/p1-t15-coverage-final-integration.test.mjs
          node --test research-orchestration/test/p1-t15-runtime-composition-wiring.test.mjs

      # P1-R05 (#93): SEAM D V2 cutover acceptance. The suite is registered as
      # fast-deterministic in suite-classification.json (so the registration guard
      # covers it), but the `test` job above only executes explicitly listed
      # suites — omitting it here would let the R05 acceptance suite be silently
      # NOT_RUN in ordinary PR CI. Cases A-F, claim lineage, F06 evidence
      # closure, identity/hash and diagnostics all run offline on fake runtimes.
      - name: P1-R05 SEAM D V2 cutover acceptance
        run: node --test research-orchestration/test/p1-r05-v2-cutover.test.mjs

      # P1-R06 (#94): dependency-closure reuse acceptance. Same REGISTERED !=
      # EXECUTED hazard as R05: registration in suite-classification.json only
      # satisfies the guard step — the `test` job runs exclusively the suites
      # listed here, so without this line the R06 acceptance suite would be
      # silently NOT_RUN in ordinary PR CI while still appearing "registered".
      # Covers: historical COMPLETE != reusable COMPLETE (earliest-invalid
      # boundary per dependency edge), the full 6-artifact content binding,
      # same-count semantic mutation, legacy/missing version refusal,
      # request/config controls, ordinary interrupted-resume re-entry, sibling
      # preservation, call-count reuse evidence and side-effect-free refusal
      # (no hash self-healing) — all offline through the real composed entrypoint.
      - name: P1-R06 complete-reuse dependency closure acceptance
        run: node --test research-orchestration/test/p1-r06-complete-reuse-closure.test.mjs

      # P1-R01 (#89): research suite classification / omission guard.
      # 该步骤在每次 PR / master push 的三个平台上执行。它校验提交的
      # suite-classification.json 覆盖了 research-orchestration/test/ 下发现的每一个
      # 核心 *.test.mjs（且无 ghost 条目）；任何未登记的新增核心 test 都会让本步骤失败，
      # 从而避免遗漏静默变绿。live / private gated suites 在此只做登记核对（NOT_RUN 清单），
      # 不在普通 PR 中执行。
      - name: research suite registration guard
        run: node research-orchestration/scripts/run-classified-research-suites.mjs guard

  # P1-R01 (#89): full offline + historical-compatibility 分类执行。
  # 在每次 PR / master push 的 Ubuntu 上执行可离线运行的研究套件
  # （historical-compat + full-offline）；live-gated / private-canonical 套件仅作为
  # NOT_RUN 报告，绝不计入 offline 通过率。历史 Git 对象通过 fetch-depth: 0 获取，
  # 以满足 historical-compat 套件（p1-seam-a-producer-conformance 的固定 T09 producer SHA、
  # p1-integration-harness 的 git archive）对历史对象的需求——浅 clone 会因对象缺失而失败。
  research-classification:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for historical Git objects)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 显式核验历史对象存在：historical-compat 套件依赖固定 T09 producer SHA
      # 4789382f36d179dc13957f2c23748f169875d7a2（actions/checkout 默认 fetch-depth:1
      # 的浅 clone 不含该对象，会让 git archive 失败）。对象缺失时给出明确失败信息，
      # 而不是把 historical 套件静默跳过。
      - name: Verify historical Git objects are present
        run: |
          PINNED_SHA=4789382f36d179dc13957f2c23748f169875d7a2
          if ! git cat-file -e "${PINNED_SHA}^{commit}"; then
            echo "HISTORICAL-GIT-OBJECT-MISSING: pinned T09 producer SHA ${PINNED_SHA} is not present in this checkout."
            echo "The historical-compat suites (p1-seam-a-producer-conformance / p1-integration-harness) require it."
            echo "Ensure the checkout provisions full history (fetch-depth: 0)."
            exit 1
          fi
          echo "historical Git object present: ${PINNED_SHA}"

      - name: research suite classification (full offline + historical; live/private NOT_RUN)
        run: node research-orchestration/scripts/run-classified-research-suites.mjs full-offline
